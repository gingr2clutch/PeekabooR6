<!--
  TIFO REFERENCE  (light version approved by Chase, Oct 1 2026)  -- design reference only, never shipped or imported.

  What this is: the /top hero, option 2 "Tifo", in the approved state:
    - banners only, hanging straight on the site's cream page (#f6f3ea). No night stadium:
      no dark background, smoke, flares, sparks, crowd, fence, posts or vignette.
    - the drops hang from one dark rod, the TOP PEEKS strip from a second one; both rods
      have round finials (initBare: rod()). Ropes and ties are unchanged.
    - every cloth canvas (3 drops + strip) has a soft warm drop shadow (the `shadow` filter in initBare).
    - the rolled-up cloth before each drop is canvas-toned, not dark-edged (S.bare branch in drawCloth).
    - no paint drips. Big painted text (rank numeral, peek names, TOP PEEKS strip, grade) =
      Space Grotesk 700. Small labels (TOP PEEK eyebrow, MAP · FLOOR, VOTES · %) = IBM Plex Mono 600.
    - production framing: 1100 x 736 stage (the mock's 64px fake nav strip is cut off)

  How to read the code:
    - common.js part (window.R6): tiny helpers + R6.mount (scaling, IntersectionObserver start,
      reduced-motion still, rAF loop). R6.nav / the .r6nav CSS are mock-only: ignore them.
    - o2.js part: the scene. Internal coordinates are 1100 x 800 with y=0 at the top of the
      (removed) nav, so the visible stage is y 64..800.
      opt.bare = true selects the approved look: init() hands off to initBare(), and render()
      skips renderStadium().
      RETIRED, do not port: init()'s stadium branch, renderStadium(), step(), drawSmoke(),
      drawSparks(), flareLevel(), the puff sprites and FLARES. That was the Sep 30 night version.
      dropArt()/stripArt() paint each banner's artwork ONCE to an offscreen canvas.
      drawCloth() redraws each banner every frame in 2px columns (ripple + fold shading + unroll).
      render(t, dt) is the only per-frame entry point.
    - DATA is hard-coded in R6.TOP here; production passes the real top 3.

  PHONES (below md): tifo-reference.html?phone=1 is the phone layout of the same light scene.
    - a 780 x 596 scene (PHONE in o2.js), drawn full-bleed at width/780 (0.5 on a 390 phone), no nav offset
    - same podium (#2 / #1 / #3), same rods, ropes, ties, shadows and timing as desktop
    - phone banner art (dropArtPhone): rank numeral, name (max 2 lines), MAP only, grade disc.
      No TOP PEEK eyebrow and no votes line on phones (they would paint at ~5px).
    - TOP PEEKS strip: cap 60, crests 76px at x 58 / w-58 (stripArt's PH branch)

  Deterministic stills for comparing a port:  tifo-reference.html?t=4.5            (desktop frame at t=4.5s)
                                              tifo-reference.html?phone=1&t=4.5    (phone frame, open at 390 wide)
  Live:                                       tifo-reference.html  /  tifo-reference.html?phone=1

<script>
/* Shared runtime for the five Top Peeks concepts.
   Every option exposes { W, H, fonts, intro, still, init(stage), reset(), render(t, dt) }.
   render() is driven by a clock, so the same code runs live (requestAnimationFrame)
   and frame-by-frame for capture (window.__seek). */
(function () {
  const R = (window.R6 = window.R6 || {});

  R.rng = function (seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };
  R.clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
  R.lerp = (a, b, t) => a + (b - a) * t;
  R.prog = (t, a, b) => R.clamp((t - a) / (b - a));
  R.smooth = (t) => t * t * (3 - 2 * t);
  R.E = {
    inQuad: (t) => t * t,
    outQuad: (t) => 1 - (1 - t) * (1 - t),
    inOutQuad: (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2),
    inCubic: (t) => t * t * t,
    outCubic: (t) => 1 - Math.pow(1 - t, 3),
    inOutCubic: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    outBack: (t, s = 1.70158) => { const c = s + 1; return 1 + c * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); },
    outExpo: (t) => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t)),
  };
  // Damped oscillation after an impulse at t = 0 (starts and ends at 0).
  R.wobble = (t, f = 1.6, d = 2.2) => (t <= 0 ? 0 : Math.exp(-d * t) * Math.sin(2 * Math.PI * f * t));
  // Step response 0 -> 1 with overshoot.
  R.settle = (t, f = 2, d = 5) => (t <= 0 ? 0 : 1 - Math.exp(-d * t) * Math.cos(2 * Math.PI * f * t));

  R.css = function (text) {
    const st = document.createElement("style");
    st.textContent = text;
    document.head.appendChild(st);
  };
  R.el = function (tag, cls, parent, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    if (parent) parent.appendChild(e);
    return e;
  };
  R.px = (n) => Math.round(n * 100) / 100 + "px";

  // Inset a convex polygon (points clockwise on screen, y down) by d.
  R.inset = function (pts, d) {
    const n = pts.length, lines = [];
    for (let i = 0; i < n; i++) {
      const a = pts[i], b = pts[(i + 1) % n];
      const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy);
      lines.push({ p: [a[0] - (dy / L) * d, a[1] + (dx / L) * d], v: [dx, dy] });
    }
    const out = [];
    for (let i = 0; i < n; i++) {
      const l1 = lines[(i - 1 + n) % n], l2 = lines[i];
      const cr = l1.v[0] * l2.v[1] - l1.v[1] * l2.v[0];
      const t = ((l2.p[0] - l1.p[0]) * l2.v[1] - (l2.p[1] - l1.p[1]) * l2.v[0]) / cr;
      out.push([l1.p[0] + l1.v[0] * t, l1.p[1] + l1.v[1] * t]);
    }
    return out;
  };
  R.path = (pts) => "M" + pts.map((p) => p[0].toFixed(2) + " " + p[1].toFixed(2)).join(" L") + " Z";

  // The real top three, Sept 30 2026.
  R.TOP = [
    { rank: 1, name: "Folding screen window", lines: ["Folding screen", "window"], map: "Emerald Plains", floor: "Second floor", fl: "2F", grade: "S+", votes: 31, pct: 94 },
    { rank: 2, name: "Tower 2", lines: ["Tower 2"], map: "Oregon", floor: "Second floor", fl: "2F", grade: "S-", votes: 181, pct: 85 },
    { rank: 3, name: "Armory balcony", lines: ["Armory", "balcony"], map: "Border", floor: "Second floor", fl: "2F", grade: "S-", votes: 143, pct: 86 },
  ];
  R.GRADE = { S: "#1f9d55", A: "#7cb342", B: "#e0a92e", C: "#d1573a" };

  // Compact replica of the site nav so each concept reads in context.
  R.nav = function () {
    return `<div class="r6nav">
      <div class="r6nav-l">
        <span class="r6logo"><svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
          <rect x="1" y="1" width="30" height="30" rx="7" fill="#fff" stroke="#e2e0d5"/>
          <path d="M8 13V8h5M19 8h5v5M24 19v5h-5M13 24H8v-5" fill="none" stroke="#1e211d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="16" cy="16" r="3.2" fill="#f2640e"/></svg>
          <b>peekaboo<em>R6</em></b></span>
        <span class="r6tog"><span class="on"><i></i>Peeks</span><span><i></i>Gadgets</span></span>
        <span class="r6links"><span>Maps</span><span class="on">Top peeks</span><span>Underrated</span><span>More <small>&#8964;</small></span></span>
      </div>
      <div class="r6nav-r">
        <span class="r6search"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="#8b8d86" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="#8b8d86" stroke-width="2" stroke-linecap="round"/></svg>Search<kbd>&#8984;K</kbd></span>
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="8" r="4" fill="none" stroke="#3f978b" stroke-width="1.8"/><path d="M4.5 20.5c1.3-3.6 4.2-5.5 7.5-5.5s6.2 1.9 7.5 5.5" fill="none" stroke="#3f978b" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span class="r6btn"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M12 15V4m0 0-4 4m4-4 4 4M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Submit a peek</span>
      </div>
    </div>`;
  };
  R.css(`
  .r6nav{position:absolute;left:0;top:0;right:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;white-space:nowrap;background:#fbfaf6;border-bottom:1px solid #e2e0d5;font-family:"Inter",system-ui,sans-serif;z-index:50}
  .r6nav-l,.r6nav-r{display:flex;align-items:center;gap:18px}.r6nav-l>*,.r6nav-r>*{flex-shrink:0}
  .r6logo{display:flex;align-items:center;gap:9px}
  .r6logo b{font-family:"Space Grotesk",system-ui,sans-serif;font-weight:700;font-size:23px;letter-spacing:-.02em;color:#1e211d}
  .r6logo em{font-style:normal;color:#f2640e}
  .r6tog{display:flex;gap:4px;padding:4px;border:1px solid #e2e0d5;border-radius:9px;background:#fff;font-size:13px;font-weight:500;color:#8b8d86}
  .r6tog span{display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:6px}
  .r6tog span.on{color:#1e211d}
  .r6tog i{width:5px;height:5px;border-radius:50%;background:#c9c7bd}
  .r6tog span.on i{background:#f2640e}
  .r6links{display:flex;gap:20px;font-size:15px;font-weight:500;color:#8b8d86}
  .r6links span{position:relative}
  .r6links span.on{color:#1e211d;font-weight:600}
  .r6links span.on:after{content:"";position:absolute;left:-2px;right:-2px;bottom:-22px;height:3px;border-radius:2px;background:#f2640e}
  .r6links small{font-size:12px}
  .r6search{display:flex;align-items:center;gap:8px;width:118px;height:38px;padding:0 10px;border:1px solid #e2e0d5;border-radius:9px;background:#fff;font-size:13.5px;color:#8b8d86}
  .r6search kbd{margin-left:auto;font:500 10.5px "Inter",sans-serif;padding:2px 5px;border:1px solid #e2e0d5;border-radius:5px;background:#f6f3ea;color:#8b8d86}
  .r6btn{display:flex;align-items:center;gap:7px;height:38px;padding:0 13px;border-radius:9px;background:#f2640e;color:#fff;font-size:14px;font-weight:600}
  `);

  R.fontsReady = function (specs, timeout = 3500) {
    if (!document.fonts || !specs || !specs.length) return Promise.resolve();
    return Promise.race([
      Promise.all(specs.map((s) => document.fonts.load(s).catch(() => null))),
      new Promise((r) => setTimeout(r, timeout)),
    ]);
  };

  R.mount = function (opt, wrap, cfg = {}) {
    const stage = wrap.querySelector(".stage");
    stage.style.width = opt.W + "px";
    stage.style.height = opt.H + "px";
    const fit = () => {
      const w = wrap.clientWidth || opt.W;
      const s = Math.min(cfg.maxScale || 1, w / opt.W);
      stage.style.transform = "scale(" + s + ")";
      wrap.style.height = opt.H * s + "px";
    };
    fit();
    if (window.ResizeObserver) new ResizeObserver(fit).observe(wrap);
    else addEventListener("resize", fit);

    const api = { play() {} };
    const start = () => {
      opt.init(stage);
      if (cfg.capture) {
        let last = -1;
        window.__seek = (t) => {
          if (t < last) { opt.reset && opt.reset(); last = -1; }
          const dt = last < 0 ? 1 / 30 : Math.max(0, t - last);
          last = t;
          opt.render(t, dt);
        };
        window.__ready = true;
        return;
      }
      const still = () => {
        opt.reset && opt.reset();
        const end = opt.still != null ? opt.still : opt.intro;
        for (let t = 0; t <= end; t += 1 / 30) opt.render(t, 1 / 30);
      };
      if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) {
        still();
        api.play = still;
        return;
      }
      let t0 = null, last = null, vis = true, raf = 0;
      const loop = (now) => {
        raf = requestAnimationFrame(loop);
        if (t0 === null) { t0 = now; last = now; }
        if (!vis) { t0 += now - last; last = now; return; }
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        opt.render((now - t0) / 1000, dt);
      };
      api.play = () => {
        opt.reset && opt.reset();
        t0 = null; last = null;
        cancelAnimationFrame(raf);
        raf = requestAnimationFrame(loop);
      };
      if ("IntersectionObserver" in window) {
        let started = false;
        new IntersectionObserver((es) => {
          es.forEach((e) => {
            vis = e.isIntersecting;
            if (vis && !started) { started = true; api.play(); }
          });
        }, { threshold: 0.2 }).observe(wrap);
        // never leave it frozen if the host never reports visibility
        setTimeout(() => { if (!started) { started = true; vis = true; api.play(); } }, 2500);
      } else api.play();
    };
    R.fontsReady(opt.fonts).then(start);
    return api;
  };
})();

</script>
<script>
/* Option 2 · TIFO
   Ultras end at night. Two flares ignite behind the fence, orange smoke rolls up through the
   stand, and three spray-stencilled canvas banners drop from the upper-tier rail and ripple in
   the wind. The page title is the frontline banner tied to the fence: TOP PEEKS, clean
   spray stencil (no drips). */
(function () {
  const R = window.R6;
  let W = 1100, H = 800;
  let RAIL_Y = 106, TOP_Y = 116, FENCE_Y = 606;
  let RODX = [104, 996]; // light version: the rod the drops hang from
  let PH = false; // phone layout (light version only)
  const CANVAS = "#e6dfcc", ORANGE = "#e9550f", INK = "#1c1d1a", STENCIL = "Big Shoulders Stencil Display";
  const LABEL = "IBM Plex Mono"; // the site's eyebrow / vote-count font
  const ART = 2, CL = 1.5; // art resolution, cloth canvas resolution
  // Display-font candidates for the painted text. tr = tracking (em) for names, trS = for the TOP PEEKS strip.
  // Approved Sep 30: Space Grotesk 700 (font #2 in the picker), no stencil cuts, no drips.
  // cut:true would cut stencil bridges through O P R B D A Q 0 4 6 8 9 ("Grotesk Stencil"); keep it off.
  const FONTS = {
    sg: { name: "Space Grotesk", fam: "Space Grotesk", w: 700, tr: -0.01, trS: 0.02, cut: false },
  };
  let F = FONTS.sg;
  let DROPS = [
    { d: R.TOP[1], cx: 250, w: 250, h: 392, t0: 1.2, ph: 0.4 },
    { d: R.TOP[0], cx: 550, w: 290, h: 442, t0: 1.62, ph: 2.1 },
    { d: R.TOP[2], cx: 850, w: 250, h: 392, t0: 1.38, ph: 4.2 },
  ];
  let STR = { x: 78, y: 620, w: 944, h: 126, t0: 0.62 };
  // Phone layout (below md): a 780 x 596 scene drawn at width/780 (0.5 on a 390 phone), so cloth,
  // stitches and grommets keep their desktop proportions. Same podium (#2 / #1 / #3) and timing,
  // no nav offset. Banner art is simplified for the small size: rank, name, map, grade.
  const PHONE = {
    W: 780, H: 596, RAIL_Y: 20, TOP_Y: 30, FENCE_Y: 424, RODX: [16, 764],
    DROPS: [
      { rank: 2, cx: 134, w: 214, h: 320, t0: 1.2, ph: 0.4 },
      { rank: 1, cx: 390, w: 250, h: 360, t0: 1.62, ph: 2.1 },
      { rank: 3, cx: 646, w: 214, h: 320, t0: 1.38, ph: 4.2 },
    ],
    STR: { x: 27, y: 438, w: 726, h: 112, t0: 0.62 },
  };
  const DROP_T = 0.55;
  const FLARES = [
    { x: 136, y: 574, t0: 0.12, fig: 2 },
    { x: 968, y: 570, t0: 0.34, fig: 17 },
  ];

  const rgba = (hex, a) => {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
  };
  const cnv = (w, h) => { const c = document.createElement("canvas"); c.width = Math.ceil(w); c.height = Math.ceil(h); return c; };

  let NOISE = null;
  function noise() {
    if (NOISE) return NOISE;
    const c = cnv(192, 192), g = c.getContext("2d"), im = g.createImageData(192, 192), rnd = R.rng(7);
    for (let i = 0; i < im.data.length; i += 4) {
      const v = rnd();
      im.data[i] = im.data[i + 1] = im.data[i + 2] = 0;
      im.data[i + 3] = v > 0.55 ? Math.floor((v - 0.55) * 560) : 0;
    }
    g.putImageData(im, 0, 0);
    return (NOISE = c);
  }

  // Font size that gives `text` a cap height of capH and keeps it within maxW, whatever the font.
  let MC = null;
  function fitPx(text, fam, w, tr, capH, maxW) {
    MC = MC || cnv(4, 4).getContext("2d");
    MC.font = `${w} 100px "${fam}"`;
    MC.letterSpacing = tr * 100 + "px";
    const m = MC.measureText(text);
    const asc = m.actualBoundingBoxAscent || 70;
    return Math.min(capH / (asc / 100), maxW / (m.width / 100));
  }

  // Spray-stencil text: overspray halo + grain knocked out of the paint. Clean edges, no drips.
  function spray(g, text, x, y, px, color, o = {}) {
    const font = `${o.weight || 900} ${px}px "${o.family || STENCIL}"`;
    const m0 = cnv(4, 4).getContext("2d");
    m0.font = font; if (o.ls) m0.letterSpacing = o.ls + "px";
    const tw = m0.measureText(text).width;
    const pad = Math.ceil(px * 0.3);
    const cw = tw + pad * 2, ch = px * 1.2 + pad * 2;
    const c = cnv(cw * ART, ch * ART), tg = c.getContext("2d");
    tg.scale(ART, ART);
    tg.font = font; if (o.ls) tg.letterSpacing = o.ls + "px";
    const bx = pad, by = pad + px * 0.95;
    tg.fillStyle = color;
    tg.shadowColor = rgba(color, o.haloA != null ? o.haloA : 0.55);
    tg.shadowBlur = (o.blur != null ? o.blur : px * 0.07) * ART;
    tg.fillText(text, bx, by);
    tg.shadowBlur = 0;
    tg.fillText(text, bx, by);
    tg.globalCompositeOperation = "destination-out";
    if (o.cut) {
      // Cut stencil bridges through every letter with a closed counter (O splits into two halves,
      // P/R/B/D lose the bowl from the stem, A loses its apex), so any font becomes a stencil.
      const capH = tg.measureText(text).actualBoundingBoxAscent || px * 0.7;
      const bw = Math.max(1.6, capH * 0.075), halo = o.blur != null ? o.blur : px * 0.07;
      const ls = o.ls || 0;
      let x0 = 0;
      for (let i = 0; i < text.length; i++) {
        const x1 = tg.measureText(text.slice(0, i + 1)).width;
        if ("OPRBDAQ04689".includes(text[i])) {
          tg.fillRect(bx + (x0 + x1 - ls) / 2 - bw / 2, by - capH - halo, bw, capH + halo * 2);
        }
        x0 = x1;
      }
    }
    tg.globalAlpha = o.grain != null ? o.grain : 0.32;
    tg.setTransform(1, 0, 0, 1, 0, 0);
    tg.fillStyle = tg.createPattern(noise(), "repeat");
    tg.fillRect(0, 0, c.width, c.height);
    const ax = o.align === "center" ? x - tw / 2 - bx : x - bx;
    g.globalAlpha = o.alpha != null ? o.alpha : 1;
    g.drawImage(c, ax, y - by, cw, ch);
    g.globalAlpha = 1;
  }

  // Green sprayed disc with the grade knocked out of it (the stencil left bare canvas).
  function sprayDisc(g, cx, cy, r, color, label, capH) {
    const s = r * 2 + 30, c = cnv(s * ART, s * ART), tg = c.getContext("2d");
    tg.scale(ART, ART);
    tg.fillStyle = color; tg.shadowColor = rgba(color, 0.5); tg.shadowBlur = 7 * ART;
    tg.beginPath(); tg.arc(s / 2, s / 2, r, 0, 7); tg.fill();
    tg.shadowBlur = 0;
    tg.globalCompositeOperation = "destination-out";
    const px = fitPx(label, F.fam, F.w, 0, capH, r * 1.45);
    tg.font = `${F.w} ${px}px "${F.fam}"`; tg.textAlign = "center";
    tg.fillText(label, s / 2, s / 2 + capH / 2);
    tg.globalAlpha = 0.28; tg.setTransform(1, 0, 0, 1, 0, 0);
    tg.fillStyle = tg.createPattern(noise(), "repeat"); tg.fillRect(0, 0, c.width, c.height);
    g.drawImage(c, cx - s / 2, cy - s / 2, s, s);
  }

  function clothBase(g, w, h, seed, scallop) {
    const rnd = R.rng(seed);
    const segs = Math.max(3, Math.round(w / (scallop || 64)));
    const gx = (i) => 9 + (i * (w - 18)) / segs;
    g.beginPath(); g.moveTo(0, 2); g.lineTo(gx(0), 1.5);
    for (let i = 0; i < segs; i++) g.quadraticCurveTo((gx(i) + gx(i + 1)) / 2, 6.5, gx(i + 1), 1.5);
    g.lineTo(w, 2); g.lineTo(w, h); g.lineTo(0, h); g.closePath();
    g.save(); g.clip();
    g.fillStyle = CANVAS; g.fillRect(0, 0, w, h);
    // weave
    g.globalAlpha = 0.05; g.fillStyle = "#6b5e45";
    for (let y = 0; y < h; y += 3) g.fillRect(0, y, w, 1);
    g.globalAlpha = 0.035;
    for (let x = 0; x < w; x += 3) g.fillRect(x, 0, 1, h);
    // stains
    for (let i = 0; i < 5; i++) {
      const x = rnd() * w, y = rnd() * h, r = 30 + rnd() * 90;
      const gr = g.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, "rgba(90,70,40,.07)"); gr.addColorStop(1, "rgba(90,70,40,0)");
      g.globalAlpha = 1; g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
    }
    g.globalAlpha = 0.09; g.fillStyle = g.createPattern(noise(), "repeat"); g.fillRect(0, 0, w, h);
    g.globalAlpha = 1;
    // hems + stitches
    g.fillStyle = "rgba(60,45,20,.07)"; g.fillRect(0, 0, w, 15); g.fillRect(0, h - 11, w, 11);
    g.strokeStyle = "rgba(70,55,30,.45)"; g.lineWidth = 1; g.setLineDash([4, 3]);
    g.beginPath(); g.moveTo(0, 15.5); g.lineTo(w, 15.5); g.moveTo(0, h - 11.5); g.lineTo(w, h - 11.5);
    g.moveTo(6.5, 16); g.lineTo(6.5, h - 12); g.moveTo(w - 6.5, 16); g.lineTo(w - 6.5, h - 12); g.stroke();
    g.setLineDash([]);
    g.restore();
    return { segs, gx };
  }
  function grommets(g, gx, segs, y) {
    for (let i = 0; i <= segs; i++) {
      const x = gx(i);
      g.fillStyle = "#9c7a3c"; g.beginPath(); g.arc(x, y, 4.4, 0, 7); g.fill();
      g.fillStyle = "#d9b86e"; g.beginPath(); g.arc(x - 0.8, y - 0.8, 3.2, 0, 7); g.fill();
      g.fillStyle = "#2a241a"; g.beginPath(); g.arc(x, y, 2, 0, 7); g.fill();
    }
  }

  function dropArt(o, idx) {
    if (PH) return dropArtPhone(o, idx);
    const { w, h, d } = o, k = w / 290;
    const c = cnv(w * ART, h * ART), g = c.getContext("2d");
    g.scale(ART, ART);
    const { segs, gx } = clothBase(g, w, h, 20 + idx, 62);
    const cx = w / 2, fam = F.fam, fw = F.w;
    // eyebrow + stats in the site's label style: Plex Mono, uppercase, tracked out
    spray(g, "TOP PEEK", cx, 46 * k, 13.5 * k, INK, { align: "center", family: LABEL, weight: 600, ls: 4 * k, grain: 0.22, blur: 1.5, alpha: 0.88 });
    // rank numeral: same painted height in every font
    const num = String(d.rank);
    spray(g, num, cx, 252 * k, fitPx(num, fam, fw, 0, 160 * k, w * 0.78), ORANGE, { align: "center", family: fam, weight: fw, blur: 11 * k, cut: F.cut });
    // peek name: one size for all lines of a banner, fitted to the cloth
    const lines = d.lines.map((s) => s.toUpperCase());
    const npx = Math.min(...lines.map((s) => fitPx(s, fam, fw, F.tr, 26 * k, w - 46 * k)));
    let y = 300 * k;
    lines.forEach((ln) => {
      spray(g, ln, cx, y, npx, INK, { align: "center", family: fam, weight: fw, ls: F.tr * npx, blur: 3, cut: F.cut });

    spray(g, `${d.votes} VOTES · ${d.pct}%`, cx, y + 18 * k, 11.5 * k, INK, { align: "center", family: LABEL, weight: 600, ls: 0.9 * k, grain: 0.2, blur: 1.2, alpha: 0.62 });
    sprayDisc(g, cx, h - 36 * k, 21 * k, R.GRADE[d.grade[0]], d.grade, 17 * k);
    grommets(g, gx, segs, 8);

  }


  // Phone banner: rank, name, map, grade. The TOP PEEK eyebrow and the votes line are left off;
  // at phone size they would paint at ~5px. Sizes are scene px (x0.5 on a 390 phone).
  function dropArtPhone(o, idx) {
    const { w, h, d } = o;
    const c = cnv(w * ART, h * ART), g = c.getContext("2d");
    g.scale(ART, ART);
    const { segs, gx } = clothBase(g, w, h, 20 + idx, 62);
    const cx = w / 2, fam = F.fam, fw = F.w;
    const capN = d.rank === 1 ? 108 : 94;
    const num = String(d.rank);
    let y = 34 + capN;
    spray(g, num, cx, y, fitPx(num, fam, fw, 0, capN, w * 0.78), ORANGE, { align: "center", family: fam, weight: fw, blur: 10, cut: F.cut });
    const lines = d.lines.map((s) => s.toUpperCase());
    const capM = 21;
    const npx = Math.min(...lines.map((s) => fitPx(s, fam, fw, F.tr, capM, w - 30)));
    y += 26 + capM;
    lines.forEach((ln, i) => {
      spray(g, ln, cx, y, npx, INK, { align: "center", family: fam, weight: fw, ls: F.tr * npx, blur: 2.5, cut: F.cut });

    sprayDisc(g, cx, h - 42, 25, R.GRADE[d.grade[0]], d.grade, 20);
    grommets(g, gx, segs, 8);

  }

  function stripArt() {
    const { w, h } = STR;
    const c = cnv(w * ART, h * ART), g = c.getContext("2d");
    g.scale(ART, ART);
    const { segs, gx } = clothBase(g, w, h, 90, 94);
    const tp = fitPx("TOP PEEKS", F.fam, F.w, F.trS, PH ? 60 : 74, w - (PH ? 250 : 290));
    spray(g, "TOP PEEKS", w / 2, PH ? 89 : 102, tp, ORANGE, { align: "center", family: F.fam, weight: F.w, ls: F.trS * tp, blur: 7, cut: F.cut });
    // stencilled crest at both ends
    const cs = PH ? 76 : 90; // crest size
    (PH ? [58, w - 58] : [70, w - 70]).forEach((x, i) => {
      const s = cnv(90 * ART, 90 * ART), tg = s.getContext("2d");
      tg.scale(ART, ART); tg.translate(45, 45);
      tg.strokeStyle = INK; tg.lineWidth = 6.5; tg.lineCap = "round"; tg.lineJoin = "round";
      tg.shadowColor = rgba(INK, 0.45); tg.shadowBlur = 3 * ART;
      const L = 22, q = 8;
      tg.beginPath();
      tg.moveTo(-L, -q); tg.lineTo(-L, -L); tg.lineTo(-q, -L);
      tg.moveTo(q, -L); tg.lineTo(L, -L); tg.lineTo(L, -q);
      tg.moveTo(L, q); tg.lineTo(L, L); tg.lineTo(q, L);
      tg.moveTo(-q, L); tg.lineTo(-L, L); tg.lineTo(-L, q);
      tg.stroke();
      tg.fillStyle = ORANGE; tg.shadowColor = rgba(ORANGE, 0.5); tg.beginPath(); tg.arc(0, 0, 7.5, 0, 7); tg.fill();
      tg.setTransform(1, 0, 0, 1, 0, 0); tg.globalCompositeOperation = "destination-out"; tg.globalAlpha = 0.3;
      tg.fillStyle = tg.createPattern(noise(), "repeat"); tg.fillRect(0, 0, s.width, s.height);
      g.drawImage(s, x - cs / 2, h / 2 - cs / 2 + 2 + (i ? 1 : -1), cs, cs);
    });
    grommets(g, gx, segs, 8);
    return c;
  }

  // Wispy smoke puffs: fractal value noise under a radial falloff, pre-tinted.
  function vnoise(seed) {
    const rnd = R.rng(seed), tab = new Float32Array(65536);
    for (let i = 0; i < 65536; i++) tab[i] = rnd();
    const at = (x, y) => tab[((y & 255) << 8) | (x & 255)];
    return (x, y) => {
      const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
      const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
      const a = at(xi, yi), b = at(xi + 1, yi), c = at(xi, yi + 1), d = at(xi + 1, yi + 1);
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  }
  function puff(color, seed) {
    const s = 128, c = cnv(s, s), g = c.getContext("2d"), im = g.createImageData(s, s), n = vnoise(seed);
    const k = parseInt(color.slice(1), 16), cr = k >> 16, cg = (k >> 8) & 255, cb = k & 255;
    for (let y = 0; y < s; y++) for (let x = 0; x < s; x++) {
      const dx = (x - s / 2) / (s / 2), dy = (y - s / 2) / (s / 2), d = Math.sqrt(dx * dx + dy * dy);
      let f = 0, amp = 0.5, fr = 1 / 18;
      for (let o = 0; o < 4; o++) { f += amp * n(x * fr + seed * 31, y * fr + seed * 17); amp *= 0.5; fr *= 2; }
      const fall = Math.max(0, 1 - d);
      const a = Math.pow(fall, 1.3) * R.clamp(0.15 + 1.25 * (f - 0.3));
      const i = (y * s + x) * 4;
      im.data[i] = cr; im.data[i + 1] = cg; im.data[i + 2] = cb; im.data[i + 3] = Math.round(a * 200);
    }
    g.putImageData(im, 0, 0);
    return c;
  }

  // Vertical alpha ramps for fold shading (taut at the top, free at the bottom / bellied in the middle).
  function ramp(h, mode, color) {
    const c = cnv(2, Math.ceil(h)), g = c.getContext("2d");
    const gr = g.createLinearGradient(0, 0, 0, h);
    if (mode === "hang") { gr.addColorStop(0, rgba(color, 0.2)); gr.addColorStop(0.25, rgba(color, 0.55)); gr.addColorStop(1, rgba(color, 1)); }
    else { gr.addColorStop(0, rgba(color, 0.15)); gr.addColorStop(0.5, rgba(color, 1)); gr.addColorStop(1, rgba(color, 0.25)); }
    g.fillStyle = gr; g.fillRect(0, 0, 2, h);
    return c;
  }

  R.css(`

  let S = null;

  function init(stage) {
    stage.innerHTML = "";
    const root = R.el("div", "o2", stage);
    // nav:false = production framing. The scene keeps its 1100x800 coordinates, but the 64px
    // mock nav strip is cut off: the root shifts up 64px inside a 1100x736 stage.
    const withNav = window.OPTS.o2.nav !== false;
    PH = window.OPTS.o2.phone === true;
    if (PH) {
      ({ W, H, RAIL_Y, TOP_Y, FENCE_Y, RODX } = PHONE);
      DROPS = PHONE.DROPS.map((g) => ({ ...g, d: R.TOP[g.rank - 1] }));
      STR = { ...PHONE.STR };
    }
    if (!withNav && !PH) { root.style.top = "-64px"; root.style.bottom = "auto"; root.style.height = "800px"; }
    const bare = window.OPTS.o2.bare === true || PH;
    root.innerHTML = (withNav ? R.nav() : "") + (bare ? "" : `<div class="bg"></div>`);
    const mk = (x, y, w, h, sc, z) => {
      const c = R.el("canvas", "", root);
      c.width = Math.ceil(w * sc); c.height = Math.ceil(h * sc);
      c.style.left = x + "px"; c.style.top = y + "px"; c.style.width = w + "px"; c.style.height = h + "px";
      if (z) c.style.zIndex = z;
      return c;
    };
    if (bare) { initBare(root, mk); return; }
    // back smoke, drawn at half resolution
    const back = mk(0, 64, W, H - 64, 0.5);
    // upper-tier rail + posts + ropes
    let posts = "";
    for (let x = 30; x < W; x += 116) posts += `<rect x="${x}" y="64" width="7" height="${RAIL_Y - 60}" fill="#1c1d19"/>`;
    let ropes = "";
    DROPS.forEach((o) => {
      const segs = Math.max(3, Math.round(o.w / 62));
      for (let i = 0; i <= segs; i++) {
        const x = o.cx - o.w / 2 + 9 + (i * (o.w - 18)) / segs;
        ropes += `<path d="M${x} ${RAIL_Y + 3} q2 6 0 ${TOP_Y + 8 - RAIL_Y - 3}" stroke="#8a7b5c" stroke-width="1.6" fill="none"/>`;
      }
    });
    root.insertAdjacentHTML("beforeend", `<svg width="${W}" height="140" viewBox="0 0 ${W} 140">${posts}
      <rect x="0" y="${RAIL_Y - 4}" width="${W}" height="8" rx="4" fill="#262822"/><rect x="0" y="${RAIL_Y - 4}" width="${W}" height="1.6" fill="#6d7680"/>${ropes}</svg>`);
    // drop banners (cloth canvases)
    const drops = DROPS.map((o, i) => {
      const cw = o.w + 80, chh = o.h + 50;
      const c = mk(o.cx - cw / 2, TOP_Y - 6, cw, chh, CL);
      return { o, c, g: c.getContext("2d"), art: dropArt(o, i), ox: 40, oy: 6, dark: ramp(o.h, "hang", "#000000"), lite: ramp(o.h, "hang", "#fff3dc") };
    });
    const front = mk(0, 64, W, H - 64, 0.5);
    // crowd behind the fence
    const rnd = R.rng(99);
    let figs = "";
    const figData = [];
    for (let i = 0; i < 20; i++) {
      const x = 40 + i * 53 + (rnd() - 0.5) * 18, hr = 12 + rnd() * 4, y = 594 + rnd() * 16;
      const arm = FLARES.some((f) => f.fig === i) ? "flare" : rnd() < 0.3 ? "up" : "";
      let s = `<g><circle cx="${x}" cy="${y}" r="${hr}"/><path d="M${x - hr * 2.3} ${y + hr * 4} Q${x - hr * 2.2} ${y + hr * 1.1} ${x} ${y + hr * 1.05} Q${x + hr * 2.2} ${y + hr * 1.1} ${x + hr * 2.3} ${y + hr * 4} Z"/>`;
      if (arm === "flare") s += `<path d="M${x + hr * 1.3} ${y + hr * 1.6} L${x + hr * 0.3} ${y - hr * 1.2}" stroke="#070807" stroke-width="${hr * 0.9}" stroke-linecap="round"/>`;
      else if (arm === "up") { const dir = rnd() < 0.5 ? -1 : 1; s += `<path d="M${x + dir * hr * 1.4} ${y + hr * 1.6} L${x + dir * hr * 2.0} ${y - hr * 1.7}" stroke="#070807" stroke-width="${hr * 0.85}" stroke-linecap="round"/>`; }
      figs += s + "</g>";
      figData.push({ ph: rnd() * 6.28, f: 1.8 + rnd() * 0.5, a: 3 + rnd() * 6, hr, x, y });
    }
    root.insertAdjacentHTML("beforeend", `<svg class="crowd" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" fill="#070807">${figs}</svg>`);
    const figEls = [...root.querySelectorAll("svg.crowd > g")];
    const tint = R.el("div", "tint", root);
    const flares = FLARES.map((f) => {
      const el = R.el("div", "fl", root, `<div class="spill"></div><div class="stick"></div><div class="halo"></div><div class="core"></div>`);
      const fd = figData[f.fig];
      f.x = fd.x + fd.hr * 0.3; f.y = fd.y - fd.hr * 1.2 - 8;
      el.style.left = f.x + "px"; el.style.top = f.y + "px";
      return { f, el, spill: el.querySelector(".spill"), halo: el.querySelector(".halo"), core: el.querySelector(".core") };
    });
    // fence
    let fposts = "";
    for (let x = 22; x < W; x += 108) fposts += `<rect x="${x}" y="${FENCE_Y}" width="8" height="${H - FENCE_Y}" fill="#141512"/>`;
    root.insertAdjacentHTML("beforeend", `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${fposts}
      <rect x="0" y="${FENCE_Y - 5}" width="${W}" height="9" rx="4.5" fill="#1e1f1b"/><rect x="0" y="${FENCE_Y - 5}" width="${W}" height="1.6" fill="#57402c"/>
      <rect x="0" y="770" width="${W}" height="8" rx="4" fill="#1a1b17"/></svg>`);
    const strip = { c: mk(STR.x - 20, STR.y - 12, STR.w + 40, STR.h + 36, CL), art: stripArt(), ox: 20, oy: 12, dark: ramp(STR.h, "belly", "#000000"), lite: ramp(STR.h, "belly", "#fff3dc") };
    strip.g = strip.c.getContext("2d");
    // ties from fence to the striscione grommets
    {
      const segs = Math.max(3, Math.round(STR.w / 94));
      let ties = "";
      for (let i = 0; i <= segs; i++) {
        const x = STR.x + 9 + (i * (STR.w - 18)) / segs;
        ties += `<path d="M${x} ${FENCE_Y + 2} L${x} ${STR.y + 9}" stroke="#8a7b5c" stroke-width="1.6"/>`;
      }
      root.insertAdjacentHTML("beforeend", `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="z-index:5">${ties}</svg>`);
      strip.c.style.zIndex = 4;
    }
    const fx = mk(0, 64, W, H - 64, 1);
    fx.style.zIndex = 6;
    R.el("div", "vig", root).style.zIndex = 7;
    S = {
      root, back, front, fx, bg: back.getContext("2d"), fg: front.getContext("2d"), xg: fx.getContext("2d"),
      drops, strip, flares, tint, figEls, figData,
      sprites: { hot: [puff("#ff7a34", 1), puff("#ff8a3c", 2), puff("#ff6a28", 7)], warm: [puff("#e0642e", 3), puff("#e3773f", 4), puff("#d9602c", 8)], dust: [puff("#9a7466", 5), puff("#8a6f68", 6), puff("#a17c6c", 9)] },
    };
    reset();
  }

  // Banners only: no stadium. The cloth hangs from two dark rods straight on the site's cream page.
  function initBare(root, mk) {
    root.style.background = "#f6f3ea";
    const ROD = "#2b2c27", HI = "#6f716a";
    const rod = (x0, x1, y) => `<rect x="${x0}" y="${y - 4}" width="${x1 - x0}" height="8" rx="4" fill="${ROD}"/><rect x="${x0 + 4}" y="${y - 3.4}" width="${x1 - x0 - 8}" height="1.4" rx=".7" fill="${HI}" opacity=".7"/>` +
      `<circle cx="${x0}" cy="${y}" r="8" fill="${ROD}"/><circle cx="${x1}" cy="${y}" r="8" fill="${ROD}"/><circle cx="${x0 - 2}" cy="${y - 2.5}" r="2.2" fill="${HI}" opacity=".6"/><circle cx="${x1 - 2}" cy="${y - 2.5}" r="2.2" fill="${HI}" opacity=".6"/>`;
    let ropes = "";
    DROPS.forEach((o) => {
      const segs = Math.max(3, Math.round(o.w / 62));
      for (let i = 0; i <= segs; i++) {
        const x = o.cx - o.w / 2 + 9 + (i * (o.w - 18)) / segs;
        ropes += `<path d="M${x} ${RAIL_Y + 3} q2 6 0 ${TOP_Y + 8 - RAIL_Y - 3}" stroke="#8a7b5c" stroke-width="1.6" fill="none"/>`;
      }
    });
    root.insertAdjacentHTML("beforeend", `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${rod(RODX[0], RODX[1], RAIL_Y)}${ropes}</svg>`);
    const shadow = "drop-shadow(0 16px 18px rgba(70,52,24,.20)) drop-shadow(0 3px 4px rgba(70,52,24,.18))";
    const drops = DROPS.map((o, i) => {
      const cw = o.w + 80, chh = o.h + 50;
      const c = mk(o.cx - cw / 2, TOP_Y - 6, cw, chh, CL);
      c.style.filter = shadow;
      return { o, c, g: c.getContext("2d"), art: dropArt(o, i), ox: 40, oy: 6, dark: ramp(o.h, "hang", "#000000"), lite: ramp(o.h, "hang", "#fff3dc") };
    });
    let ties = "";
    const segs = Math.max(3, Math.round(STR.w / 94));
    for (let i = 0; i <= segs; i++) {
      const x = STR.x + 9 + (i * (STR.w - 18)) / segs;
      ties += `<path d="M${x} ${FENCE_Y + 2} L${x} ${STR.y + 9}" stroke="#8a7b5c" stroke-width="1.6"/>`;
    }
    root.insertAdjacentHTML("beforeend", `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="z-index:5">${rod(STR.x - 14, STR.x + STR.w + 14, FENCE_Y)}${ties}</svg>`);
    const strip = { c: mk(STR.x - 20, STR.y - 12, STR.w + 40, STR.h + 36, CL), art: stripArt(), ox: 20, oy: 12, dark: ramp(STR.h, "belly", "#000000"), lite: ramp(STR.h, "belly", "#fff3dc") };
    strip.g = strip.c.getContext("2d");
    strip.c.style.zIndex = 4; strip.c.style.filter = shadow;
    S = { root, bare: true, drops, strip, flares: [], figEls: [], figData: [] };
    reset();
  }

  function reset() {
    if (!S) return;
    S.smoke = []; S.sparks = []; S.acc = 0; S.simT = 0; S.rnd = R.rng(2024);
    S.emit = FLARES.map(() => 0).concat([0, 0]);
  }

  function flareLevel(t, f) {
    const u = t - f.t0;
    if (u < 0) return 0;
    const pop = u < 0.12 ? 1.6 : u < 0.3 ? R.lerp(1.6, 1, (u - 0.12) / 0.18) : 1;
    return pop * (0.86 + 0.14 * Math.sin(t * 31 + f.x) * Math.sin(t * 17.3 + f.y));
  }

  function step(t, dt) {
    const rnd = S.rnd;
    const wind = 26 + 16 * Math.sin(t * 0.35) + 10 * Math.sin(t * 1.1);
    // emit
    FLARES.forEach((f, i) => {
      if (t < f.t0) return;
      S.emit[i] += dt * 34;
      while (S.emit[i] >= 1) {
        S.emit[i] -= 1;
        S.smoke.push({ x: f.x + (rnd() - 0.5) * 6, y: f.y - 4, vx: (rnd() - 0.5) * 60, vy: -120 - rnd() * 60, r0: 9 + rnd() * 8, r1: 110 + rnd() * 90, life: 3.6 + rnd() * 2.2, age: 0, sp: Math.floor(rnd() * 3), front: rnd() < 0.3, hot: true, ph: rnd() * 6.28 });
      }
      S.emit[i] += 0;
      const sparkRate = 46;
      let n = dt * sparkRate + (rnd() < (dt * sparkRate) % 1 ? 1 : 0);
      for (let j = 0; j < Math.floor(n); j++) {
        const a = -Math.PI / 2 + (rnd() - 0.5) * 2.2, v = 70 + rnd() * 170;
        S.sparks.push({ x: f.x, y: f.y - 6, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.35 + rnd() * 0.7, age: 0, s: 1 + rnd() * 1.6 });
      }
    });
    // off-screen smoke banks at the bottom corners keep the stand hazy
    [[-60, 830], [W + 60, 830]].forEach(([x, y], i) => {
      if (t < 0.2) return;
      S.emit[2 + i] += dt * 5;
      while (S.emit[2 + i] >= 1) {
        S.emit[2 + i] -= 1;
        S.smoke.push({ x: x + (rnd() - 0.5) * 60, y, vx: (i ? -30 : 50) + (rnd() - 0.5) * 30, vy: -45 - rnd() * 25, r0: 90, r1: 260 + rnd() * 90, life: 7 + rnd() * 3, age: 0, sp: Math.floor(rnd() * 3), front: rnd() < 0.25, hot: false, ph: rnd() * 6.28 });
      }
    });
    S.smoke.forEach((p) => {
      p.age += dt;
      p.vx += (wind * 0.9 - p.vx) * 0.35 * dt + Math.sin(p.y * 0.012 + t * 0.7 + p.ph) * 22 * dt;
      p.vy += (-42 - p.vy) * 0.8 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
    });
    S.smoke = S.smoke.filter((p) => p.age < p.life);
    S.sparks.forEach((s) => { s.age += dt; s.vy += 260 * dt; s.vx *= 0.99; s.x += s.vx * dt; s.y += s.vy * dt; });
    S.sparks = S.sparks.filter((s) => s.age < s.life);
  }

  function drawSmoke(g, front) {
    g.setTransform(0.5, 0, 0, 0.5, 0, -32);
    g.clearRect(0, 64, W, H);
    for (const p of S.smoke) {
      if (p.front !== front) continue;
      const u = p.age / p.life;
      const r = p.r0 + (p.r1 - p.r0) * Math.pow(u, 0.55);
      let a = R.clamp(p.age / 0.25) * Math.pow(1 - u, 1.4) * (front ? 0.42 : 0.8);
      if (p.y < 300) a *= R.clamp((p.y - 40) / 260);
      const sp = p.sp;
      if (p.hot && p.age < 0.6) {
        g.globalCompositeOperation = "lighter";
        g.globalAlpha = a * (1 - p.age / 0.6) * 0.5;
        g.drawImage(S.sprites.hot[sp], p.x - r, p.y - r, r * 2, r * 2);
      }
      g.globalCompositeOperation = "source-over";
      const warmW = p.hot ? R.clamp(1 - (p.age - 0.4) / 2.2) : 0.25;
      g.globalAlpha = a * warmW;
      if (warmW > 0.01) g.drawImage(S.sprites.warm[sp], p.x - r, p.y - r, r * 2, r * 2);
      g.globalAlpha = a * (1 - warmW) * 0.9;
      g.drawImage(S.sprites.dust[sp], p.x - r, p.y - r, r * 2, r * 2);
    }
    g.globalAlpha = 1; g.globalCompositeOperation = "source-over";
  }

  function fold(x, t, ph) {
    return 0.55 * Math.sin(0.043 * x - 1.7 * t + ph) + 0.3 * Math.sin(0.107 * x + 1.25 * t + ph * 1.7) + 0.15 * Math.sin(0.23 * x - 2.9 * t + ph * 0.3);
  }

  // Draw a hanging cloth in 2px columns: each column stretches a touch (wavy hem) and takes
  // fold shading that grows toward the free edge. reveal = how much has unrolled so far.
  function drawCloth(g, art, w, h, t, ph, amp, shear, reveal, stretch, ox, oy, sh, rollColor) {
    g.setTransform(CL, 0, 0, CL, 0, 0);
    g.clearRect(0, 0, g.canvas.width, g.canvas.height);
    g.translate(ox, oy);
    g.transform(1, 0, shear, 1, 0, 0);
    const col = 2, vis = Math.min(reveal, h);
    if (vis > 0.5) {
      for (let x = 0; x < w; x += col) {
        const s = fold(x, t, ph) * amp;
        const hh = vis * (1 + 0.013 * s * (vis / h)) * stretch;
        g.drawImage(art, x * ART, 0, col * ART, vis * ART, x, 0, col + 0.6, hh);
        const a = Math.abs(s);
        if (a > 0.03) {
          g.globalCompositeOperation = "source-atop";
          g.globalAlpha = Math.min(1, a) * (s < 0 ? 0.34 : 0.2);
          g.drawImage(s < 0 ? sh.dark : sh.lite, 0, 0, 2, vis, x, 0, col + 0.6, hh);
          g.globalAlpha = 1;
          g.globalCompositeOperation = "source-over";
        }
      }
    }
    if (reveal < h + 30) {
      // the roll, tied until it is cut loose, then unwinding as it falls
      const full = Math.min(34, 14 + w * 0.05);
      const rh = 10 + (full - 10) * (1 - R.clamp(reveal / h));
      const y = Math.min(reveal, h) - rh * 0.3;
      const gr = g.createLinearGradient(0, y, 0, y + rh);
      // rolled canvas: dark-edged on the night stage, canvas-toned on the cream page
      const rs = S && S.bare ? ["#9a907a", "#cfc6af", "#efe8d6", "#d6cdb6", "#958b75"] : ["#2e2a23", "#7f7664", "#b3aa95", "#8e8571", "#2a261f"];
      gr.addColorStop(0, rs[0]); gr.addColorStop(0.25, rs[1]); gr.addColorStop(0.45, rs[2]);
      gr.addColorStop(0.65, rs[3]); gr.addColorStop(1, rs[4]);
      g.globalAlpha = R.clamp(1 - (reveal - h) / 30);
      g.fillStyle = gr;
      g.beginPath(); g.roundRect(-3, y, w + 6, rh, 4); g.fill();
      // spiral ends
      g.strokeStyle = S && S.bare ? "rgba(90,78,55,.45)" : "rgba(40,34,26,.55)"; g.lineWidth = 1;
      [[-3, 1], [w + 3, -1]].forEach(([ex, dir]) => {
        g.beginPath(); g.ellipse(ex + dir * 2.5, y + rh / 2, 2.5, rh / 2 - 1, 0, 0, 7); g.stroke();
        g.beginPath(); g.ellipse(ex + dir * 2.5, y + rh / 2, 1.2, rh / 4, 0, 0, 7); g.stroke();
      });
      if (reveal <= 0.01) {
        g.strokeStyle = "#6e5f45"; g.lineWidth = 2.2;
        [0.18, 0.5, 0.82].forEach((f) => { const x = w * f; g.beginPath(); g.moveTo(x - 3, y - 1); g.quadraticCurveTo(x + 2, y + rh / 2, x - 3, y + rh + 1); g.stroke(); });
      }
      g.globalAlpha = 1;
    }
  }

  function render(t, dt) {
    if (!S) return;
    if (!S.bare) renderStadium(t, dt);
    renderCloth(t);
  }

  // Night-stadium layer: particle sim, flares, crowd, smoke, sparks. Skipped in banners-only mode.
  function renderStadium(t, dt) {
    // fixed-step sim
    S.acc += Math.min(dt, 0.1);
    while (S.acc >= 1 / 30) { S.acc -= 1 / 30; S.simT += 1 / 30; step(S.simT, 1 / 30); }

    // flares + light
    let lvSum = 0;
    S.flares.forEach(({ f, el, spill, halo, core }) => {
      const lv = flareLevel(t, f);
      lvSum += Math.min(1, lv);
      el.style.opacity = lv > 0 ? 1 : 0;
      halo.style.transform = `scale(${(0.8 + 0.35 * lv).toFixed(3)})`;
      halo.style.opacity = Math.min(1, lv).toFixed(3);
      spill.style.opacity = (0.75 * Math.min(1.2, lv)).toFixed(3);
      core.style.transform = `scale(${(0.9 + 0.2 * Math.sin(t * 40 + f.x)).toFixed(3)})`;
    });
    S.tint.style.opacity = (lvSum / S.flares.length).toFixed(3);
    // jumping crowd (starts once the flares are lit)
    const jump = R.smooth(R.prog(t, 0.5, 1.4));
    S.figEls.forEach((g, i) => {
      const fd = S.figData[i];
      const y = -jump * fd.a * Math.abs(Math.sin(Math.PI * fd.f * t + fd.ph));
      g.setAttribute("transform", `translate(0 ${y.toFixed(2)})`);
      FLARES.forEach((f, j) => { if (f.fig === i) S.flares[j].el.style.transform = `translateY(${y.toFixed(2)}px)`; });
    });

    drawSmoke(S.bg, false);
    drawSmoke(S.fg, true);
    drawSparks();
  }

  function drawSparks() {
    // sparks
    const x = S.xg;
    x.setTransform(1, 0, 0, 1, 0, -64);
    x.clearRect(0, 64, W, H);
    x.globalCompositeOperation = "lighter";
    for (const s of S.sparks) {
      const u = s.age / s.life;
      x.globalAlpha = (1 - u) * 0.95;
      x.fillStyle = u < 0.3 ? "#fff1c2" : u < 0.6 ? "#ffb04a" : "#ff6a26";
      x.beginPath(); x.arc(s.x, s.y, s.s * (1 - u * 0.5), 0, 7); x.fill();
    }
    x.globalAlpha = 1; x.globalCompositeOperation = "source-over";
  }

  function renderCloth(t) {
    const gust = 0.5 + 0.3 * Math.sin(t * 0.55) + 0.2 * Math.sin(t * 1.7);
    S.drops.forEach(({ o, g, art, ox, oy, dark, lite }) => {
      const u = R.prog(t, o.t0, o.t0 + DROP_T);
      const p = u <= 0 ? 0 : Math.min(1, 0.1 * u + 0.9 * u * u);
      const done = o.t0 + DROP_T;
      const reveal = p * (o.h + 30);
      const flap = u > 0 && u < 1 ? 1.1 : t > done ? 0.35 + 0.65 * Math.exp(-(t - done) * 1.6) : 0.4;
      const amp = Math.max(flap, 0.28 + 0.28 * gust);
      const shear = (0.018 * Math.sin(t * 0.8 + o.ph) + 0.012 * gust) * (t > done ? 1 : p) + (t > done ? 0.03 * R.wobble(t - done, 1.1, 2.4) : 0);
      const stretch = t > done ? 1 + 0.03 * R.wobble(t - done, 2.4, 5) : 1;
      drawCloth(g, art, o.w, o.h, t, o.ph, amp, shear, reveal, stretch, ox, oy, { dark, lite }, CANVAS);
    });
    {
      const s = S.strip, u = R.prog(t, STR.t0, STR.t0 + 0.42);
      const reveal = (u <= 0 ? 0 : Math.min(1, 0.15 * u + 0.85 * u * u)) * (STR.h + 30);
      const done = STR.t0 + 0.42;
      const stretch = t > done ? 1 + 0.04 * R.wobble(t - done, 2.8, 6) : 1;
      drawCloth(s.g, s.art, STR.w, STR.h, t * 0.8, 1.3, 0.45 + 0.2 * gust, 0, reveal, stretch, s.ox, s.oy, s, CANVAS);
    }
  }

  // Swap the painted font. The banners keep hanging; only their artwork is repainted.
  function setFont(key) {
    if (!FONTS[key]) return;
    F = FONTS[key];
    if (!S) return;
    S.drops.forEach((dd, i) => { dd.art = dropArt(dd.o, i); });
    S.strip.art = stripArt();
  }

  (window.OPTS = window.OPTS || {}).o2 = {
    W, H, intro: 4.2, still: 6,
    fonts: Object.values(FONTS).map((f) => `${f.w} 40px "${f.fam}"`).concat([`600 12px "${LABEL}"`]),
    FONTS, setFont,
    init, reset, render,
  };
})();

</script>
<script>
(function () {
  const opt = window.OPTS.o2;
  opt.nav = false;        // production framing
  opt.bare = true;        // approved Oct 1: banners only, on the cream page
  const phone = new URLSearchParams(location.search).get('phone') === '1';
  if (phone) { opt.phone = true; opt.W = 780; opt.H = 596; document.body.classList.add('phone'); }
  else opt.H = 736;       // visible stage height
  opt.fonts = ['700 40px "Space Grotesk"', '600 12px "IBM Plex Mono"'];
  const t = parseFloat(new URLSearchParams(location.search).get('t'));
  const wrap = document.getElementById('tifo');
  if (isFinite(t)) {
    R6.mount(opt, wrap, { capture: true, maxScale: 1 });
    const wait = setInterval(() => { if (window.__ready) { clearInterval(wait); for (let i = 0; i <= Math.round(t * 30); i++) window.__seek(i / 30); document.body.dataset.done = '1'; } }, 50);
  } else {
    R6.mount(opt, wrap, { maxScale: 1 });
  }
})();
</script>
