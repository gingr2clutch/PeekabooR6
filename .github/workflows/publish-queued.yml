name: Publish queued peeks

on:
  schedule:
    - cron: "0 16 * * *" # daily at 16:00 UTC; the Mon/Wed/Fri release gate lives in the app
  workflow_dispatch: {} # manual "Run workflow" button

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish next queued peek
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is not set."
            exit 1
          fi
          code=$(curl -sS -o /tmp/out.json -w "%{http_code}" \
            "https://peekaboor6.com/api/cron/publish-queued" \
            -H "Authorization: Bearer $CRON_SECRET")
          echo "HTTP $code"
          cat /tmp/out.json || true
          echo
          test "$code" = "200"
